name: Validate skill helpers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locate or install FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Locate or install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run portable synthetic checks
        run: python tests/smoke.py
